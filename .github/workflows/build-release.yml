# Автосборка установщика Луна IDE.
#
# Как пользоваться (без установки git, прямо в браузере):
#   1. Открыть репозиторий → вкладка «Releases» → «Draft a new release».
#   2. Указать тег (например v1.1.0) и нажать «Publish release».
#   3. Этот workflow соберёт .exe и сам приложит его к релизу.
#
# Файл Luna-IDE-Setup.exe (без версии в имени) нужен, чтобы ссылка
# .../releases/latest/download/Luna-IDE-Setup.exe никогда не менялась —
# именно её использует страница проекта.

name: Сборка установщика

on:
  release:
    types: [published]
  workflow_dispatch:        # можно запустить вручную: Actions → Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать установщик (NSIS)
        # --publish never: сборку к релизу прикладывает шаг ниже.
        # Без этого флага electron-builder сам пробует «опубликовать» и падает без токена.
        run: npx electron-builder --win nsis --publish never

      # Имя установщика постоянное (build.nsis.artifactName = Luna-IDE-Setup.exe),
      # поэтому ссылка .../releases/latest/download/Luna-IDE-Setup.exe не меняется,
      # а latest.yml ссылается на то же имя. К релизу прикладываем три файла:
      # установщик, манифест версии и блокмап для докачки. Переименовывать ничего не нужно.
      - name: Проверить имена файлов сборки
        run: |
          if (!(Test-Path release\Luna-IDE-Setup.exe)) { throw "нет release\Luna-IDE-Setup.exe — проверьте build.nsis.artifactName" }
          if (!(Test-Path release\latest.yml)) { throw "нет release\latest.yml — без него автообновление не увидит версию" }
          if (-not (Select-String -Path release\latest.yml -Pattern "url: Luna-IDE-Setup.exe" -Quiet)) { throw "latest.yml ссылается на другое имя файла" }

      - name: Приложить файлы к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Luna-IDE-Setup.exe
            release/Luna-IDE-Setup.exe.blockmap
            release/latest.yml

      - name: Сохранить файлы как артефакт (для ручного запуска)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Luna-IDE-Setup
          path: |
            release/Luna-IDE-Setup.exe
            release/latest.yml
          retention-days: 14
